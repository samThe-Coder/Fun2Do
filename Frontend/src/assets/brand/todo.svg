<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="check-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    
    <filter id="check-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Icon Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Subtle Accent Circle in Background -->
  <circle cx="400" cy="110" r="180" fill="#FFFFFF" opacity="0.05" />

  <!-- Main Checklist Clipboard/Card -->
  <g filter="url(#shadow)">
    <rect x="116" y="96" width="280" height="340" rx="32" fill="url(#card-grad)" />
  </g>

  <!-- Clip Header Top Accent -->
  <rect x="196" y="76" width="120" height="40" rx="12" fill="#312E81" />
  <rect x="236" y="88" width="40" height="16" rx="8" fill="#6366F1" />

  <!-- Task 1: Completed Task -->
  <g transform="translate(156, 164)">
    <!-- Checked Box -->
    <rect x="0" y="0" width="36" height="36" rx="10" fill="url(#check-grad)" filter="url(#check-shadow)" />
    <path d="M10 18 L16 24 L26 12" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Completed Line text -->
    <rect x="52" y="14" width="148" height="8" rx="4" fill="#94A3B8" opacity="0.5" />
    <!-- Strike-through line -->
    <line x1="50" y1="18" x2="190" y2="18" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Task 2: In-Progress / Unchecked Task -->
  <g transform="translate(156, 236)">
    <!-- Unchecked Box -->
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="3" />
    
    <!-- Task Line Text -->
    <rect x="52" y="14" width="130" height="8" rx="4" fill="#334155" />
  </g>

  <!-- Task 3: Unchecked Task -->
  <g transform="translate(156, 308)">
    <!-- Unchecked Box -->
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="3" />
    
    <!-- Task Line Text -->
    <rect x="52" y="14" width="90" height="8" rx="4" fill="#64748B" opacity="0.7" />
  </g>

  <!-- Floating Sparkle / Plus Icon (Add Task visual) -->
  <g transform="translate(360, 340)" filter="url(#shadow)">
    <circle cx="28" cy="28" r="28" fill="#10B981" />
    <path d="M28 18 V38 M18 28 H38" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
